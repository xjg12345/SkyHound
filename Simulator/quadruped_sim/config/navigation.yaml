base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0
planner_patience: 3.0
controller_patience: 18.0
recovery_behavior_enabled: false
oscillation_timeout: 0.0
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0
DWAPlannerROS:
  odom_topic: /dog1/odom
  max_vel_x: 0.30
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.30
  min_vel_trans: 0.02
  max_vel_theta: 0.70
  min_vel_theta: 0.08
  acc_lim_x: 0.40
  acc_lim_y: 0.0
  acc_lim_theta: 1.2
  vx_samples: 12
  vy_samples: 1
  vth_samples: 24
  sim_time: 1.7
  xy_goal_tolerance: 0.22
  yaw_goal_tolerance: 0.30
  latch_xy_goal_tolerance: true
  path_distance_bias: 30.0
  goal_distance_bias: 22.0
  occdist_scale: 0.08
  publish_global_plan: true
  publish_local_plan: true
global_costmap:
  global_frame: dog_map
  robot_base_frame: dog1/base_footprint
  footprint: &footprint [[0.30, 0.18], [0.30, -0.18], [-0.30, -0.18], [-0.30, 0.18]]
  footprint_padding: 0.03
  transform_tolerance: 0.35
  update_frequency: 3.0
  publish_frequency: 1.0
  plugins:
    - {name: static, type: "costmap_2d::StaticLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  static: {map_topic: /dog_map}
  inflation: {inflation_radius: 0.55, cost_scaling_factor: 4.0}
local_costmap:
  global_frame: dog1/odom
  robot_base_frame: dog1/base_footprint
  footprint: *footprint
  footprint_padding: 0.03
  transform_tolerance: 0.35
  update_frequency: 10.0
  publish_frequency: 4.0
  always_send_full_costmap: true
  rolling_window: true
  width: 5.0
  height: 5.0
  resolution: 0.05
  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  obstacles:
    observation_sources: laser
    laser: {topic: /dog1/nav_scan, data_type: LaserScan, marking: true, clearing: true, inf_is_valid: true, obstacle_range: 4.0, raytrace_range: 7.5, expected_update_rate: 0.5}
  inflation: {inflation_radius: 0.55, cost_scaling_factor: 4.0}
